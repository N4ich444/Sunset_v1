services:
  # extend as needed
  # remember you can launch each individual service
  # WARNING DO NOT LAUNCH with 'docker compose up' without specifying a service

  # first server
  server_0:
    build:
      context: .
      dockerfile: Server.Dockerfile
    environment:
      NODE_ENV: production

    # maps container 8080 to actual port
    # TODO DEBUG CONF CHANGE BACK TO 49152 ON PROD
    ports:
      - 49152:8080

    # bind mount userdata volume to /app/userdata in docker
    volumes:
      - userdata_fserv_slot_0:/usr/src/app/userdata
      - userdata_fserv_share:/usr/src/app/shareddata

    deploy:
      resources:
        limits: 
          cpus: '1'
          memory: '4G'
        reservations:
          cpus: '0.5'
          memory: '2G'


